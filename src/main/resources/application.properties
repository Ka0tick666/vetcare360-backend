spring.application.name=vetcare360-backend
server.port=${PORT:8080}

# Cognito: configure the real User Pool issuer before starting
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}

# Supabase PostgreSQL: never commit actual credentials
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
